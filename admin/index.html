<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Admin Sign In - Laurel Lodge</title>
  <meta name="robots" content="noindex, nofollow">

  <!-- Favicons -->
  <link href="../assets/img/favicon.png" rel="icon">
  <link href="../assets/img/apple-touch-icon.png" rel="apple-touch-icon">

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/" rel="preconnect">
  <link href="https://fonts.gstatic.com/" rel="preconnect" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Raleway:wght@400;600;700&family=Montserrat:wght@500;600&display=swap" rel="stylesheet">

  <link href="admin.css" rel="stylesheet">
</head>
<body class="admin-page">

  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-branding">
        <h1 class="brand-name">Laurel Lodge</h1>
        <p class="brand-subtitle">Availability Administration</p>
      </div>

      <div id="loginError" class="login-error" role="alert"></div>

      <form id="loginForm" class="login-form">
        <div class="form-group">
          <label for="loginEmail">Email Address</label>
          <input type="email" id="loginEmail" name="email" required autocomplete="email" placeholder="stephen@example.com">
        </div>

        <div class="form-group">
          <label for="loginPassword">Password</label>
          <input type="password" id="loginPassword" name="password" required autocomplete="current-password" placeholder="••••••••">
        </div>

        <button type="submit" id="loginBtn" class="btn-signin">Sign In</button>
      </form>

      <div class="login-footer">
        Laurel Lodge &copy; Administration System
      </div>
    </div>
  </div>

  <!-- Firebase & Availability API -->
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
  <script src="../assets/js/firebase-config.js"></script>
  <script src="../assets/js/availability-api.js"></script>
  <script src="admin.js"></script>
</body>
</html>
